apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-2
  namespace: jenkins

spec:
  replicas: 2

  selector:
    matchLabels:
      app: app-2

  template:
    metadata:
      labels:
        app: app-2

    spec:
      containers:
        - name: container-2
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always

          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

---

apiVersion: v1
kind: Service
metadata:
  name: service-2
  namespace: jenkins

spec:
  selector:
    app: app-2

  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

  type: ClusterIP
