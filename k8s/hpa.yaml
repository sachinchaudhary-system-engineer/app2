apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: hpa-1
  namespace: jenkins

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: deployment-2

  minReplicas: 1
  maxReplicas: 4

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 30
